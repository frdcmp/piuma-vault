apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-postgres
  namespace: piuma-vault
spec:
  accessModes: [ReadWriteOnce]
  # Postgres commits need a durable fsync, so this must never land on a spinning
  # disk: longhorn-latency selects only disks tagged ssd. Never rely on the
  # cluster default here.
  storageClassName: longhorn-latency
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: piuma-vault
spec:
  replicas: 1
  strategy: {type: Recreate}        # RWO volume: never two pods holding it
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg15
          env:
            - {name: POSTGRES_DB,       valueFrom: {configMapKeyRef: {name: pv-config, key: DB_NAME}}}
            - {name: POSTGRES_USER,     valueFrom: {configMapKeyRef: {name: pv-config, key: DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef:    {name: pv-secret, key: DB_PASSWORD}}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["sh","-c","pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: pv-postgres}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: piuma-vault
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
