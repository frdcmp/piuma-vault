apiVersion: v1
kind: Namespace
metadata: {name: registry}
---
apiVersion: v1
kind: PersistentVolumeClaim
# The cluster's own private image registry. Despite an earlier name, this
# has nothing to do with Docker Hub: it is where locally built images are
# pushed and where the nodes pull them from.
metadata: {name: images, namespace: registry}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-capacity   # container images are bulk, sequential
  resources: {requests: {storage: 20Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: registry, namespace: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
        - name: registry
          image: registry:2
          env:
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          ports: [{containerPort: 5000}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: images}
---
apiVersion: v1
kind: Service
metadata: {name: registry, namespace: registry}
spec:
  selector: {app: registry}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: registry
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: registry, port: {number: 5000}}
  tls:
    - hosts: [registry]
