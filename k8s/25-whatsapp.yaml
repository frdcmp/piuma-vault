# whatsapp-bridge: the users' WhatsApp for Pigeon, one linked device each (whatsapp-bridge/,
# whatsmeow). Only the vault talks to it (http://whatsapp-bridge:8080, the bearer
# PIGEON_WHATSAPP_BRIDGE_SECRET); it posts what it sees to http://rust:8080/pigeon/webhooks/whatsapp.
# One replica, Recreate: two would be two clients of each device. The sessions (SQLite) are on
# its volume: a restart doesn't log the phones out.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-whatsapp-sessions
  namespace: piuma-vault
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn-latency
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-bridge
  namespace: piuma-vault
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: whatsapp-bridge}}
  template:
    metadata: {labels: {app: whatsapp-bridge}}
    spec:
      # Leave a dead home node after 60 s rather than the cluster's 3600 s: the other home
      # node holds a replica of every volume, so the pod restarts there.
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 60}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 60}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: whatsapp-bridge
          image: __REGISTRY__/piuma-vault-whatsapp-bridge:b8dc73c42161
          imagePullPolicy: IfNotPresent      # built locally, imported into containerd
          env:
            - name: PIGEON_WHATSAPP_BRIDGE_SECRET
              valueFrom: {secretKeyRef: {name: pv-secret, key: PIGEON_WHATSAPP_BRIDGE_SECRET}}
            - {name: PIGEON_WEBHOOK_URL, value: "http://rust:8080/pigeon/webhooks/whatsapp"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: sessions, mountPath: /data}
            - {name: tmp, mountPath: /tmp}         # a file on its way to the vault (POST /u/{user}/media)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 10m, memory: 48Mi}, limits: {memory: 256Mi}}
      volumes:
        - name: sessions
          persistentVolumeClaim: {claimName: pv-whatsapp-sessions}
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-bridge
  namespace: piuma-vault
spec:
  selector: {app: whatsapp-bridge}
  ports: [{name: http, port: 8080, targetPort: http}]
