apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust
  namespace: piuma-vault
spec:
  replicas: 1
  selector: {matchLabels: {app: rust}}
  template:
    metadata: {labels: {app: rust}}
    spec:
      containers:
        - name: rust
          image: __REGISTRY__/piuma-vault-rust:7bee3c6f71b0
          imagePullPolicy: IfNotPresent      # built locally, imported into containerd
          args: ["backend"]
          envFrom:
            - configMapRef: {name: pv-config}
            - secretRef: {name: pv-secret}
          # Host attribution for telemetry. The node is injected per-pod, but the
          # "-piuma" suffix is kept: telemetry hardcodes source="backend" and both
          # this app and keeperproxy ship to the SAME ingest, so `server` is the
          # only field distinguishing them. A bare node name would merge them.
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: SERVER_NAME
              value: "$(NODE_NAME)-piuma"
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rust
  namespace: piuma-vault
spec:
  selector: {app: rust}
  ports: [{port: 8080, targetPort: 8080}]
---
