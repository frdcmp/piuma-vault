apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust
  namespace: piuma-vault
spec:
  replicas: 1
  selector: {matchLabels: {app: rust}}
  template:
    metadata: {labels: {app: rust}}
    spec:
      containers:
        - name: rust
          image: docker.io/library/piuma-vault-rust-prod:latest
          imagePullPolicy: IfNotPresent      # built locally, imported into containerd
          args: ["backend"]
          envFrom:
            - configMapRef: {name: pv-config}
            - secretRef: {name: pv-secret}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: rust
  namespace: piuma-vault
spec:
  selector: {app: rust}
  ports: [{port: 8080, targetPort: 8080}]
---
